<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Τα Ταξίδια μου</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e7c86">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ταξίδια μου">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--bg:#f6f4ef;--card:#fff;--ink:#1f2a37;--muted:#6b7280;--accent:#0e7c86;--accent2:#e4572e;--line:#e5e1d8}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--accent);color:#fff;padding:12px 16px 0;position:sticky;top:0;z-index:1000}
  header h1{margin:0 0 6px;font-size:20px}
  .stats{font-size:13px;opacity:.9;margin-bottom:8px}
  nav{display:flex;gap:4px;overflow-x:auto}
  nav button{background:none;border:0;color:#d7f1f3;padding:10px 14px;font-size:15px;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
  nav button.active{background:var(--bg);color:var(--ink);font-weight:600}
  main{max-width:900px;margin:0 auto;padding:16px}
  section{display:none} section.active{display:block}
  #map{height:62vh;border-radius:16px;box-shadow:0 6px 24px #0e7c8626,0 1px 3px #0002;background:#d9eef2}
  .leaflet-container{font-family:inherit}
  .pin{background:none;border:0;filter:drop-shadow(0 2px 2px #0005);transition:transform .15s}
  .pin:hover{transform:scale(1.15)}
  .plane{background:#fff;border-radius:50%;box-shadow:0 1px 4px #0004;display:flex;align-items:center;justify-content:center;font-size:14px}
  .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 8px 24px #0003}
  .leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.45}
  .pop-h{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
  .pop-h img{width:26px;border-radius:3px;box-shadow:0 0 0 1px #0002}
  .pop-sub{color:var(--muted);font-size:13px;margin:2px 0 8px}
  .pop-meta{font-size:13px;margin-bottom:8px}
  .mapchip{background:#fffffff0;backdrop-filter:blur(4px);border-radius:12px;padding:8px 12px;box-shadow:0 2px 10px #0002;font-size:13px;line-height:1.35}
  .mapchip b{color:var(--accent);font-size:17px}
  .mapchip .bar{height:6px;background:#e5e7eb;border-radius:3px;margin-top:5px;overflow:hidden;width:150px}
  .mapchip .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f2b705)}
  .mapbtn{background:#fff;border:0;border-radius:10px;box-shadow:0 2px 8px #0003;padding:8px 11px;font-size:13px;cursor:pointer;font-family:inherit}
  .hrow{display:flex;align-items:center;gap:10px}
  .hbtn{margin-left:auto;background:#ffffff26;color:#fff;border:1px solid #ffffff59;border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer;font-family:inherit}
  .hbtn:hover{background:#ffffff40}
  #shareImg{width:100%;border-radius:10px;box-shadow:0 2px 10px #0002;display:block;margin:10px 0;min-height:120px;background:#eee}
  .opt{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
  .sharebtns{display:flex;flex-wrap:wrap;gap:8px}
  .sharebtns .btn{flex:1;min-width:140px}
  .row{display:flex;gap:8px;margin-bottom:10px}
  input[type=text],textarea{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
  textarea{width:100%;min-height:60px;resize:vertical}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
  .btn.sec{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  .btn.small{padding:4px 10px;font-size:13px}
  .x{background:none;border:0;color:#b91c1c;cursor:pointer;font-size:16px;padding:0 4px}
  .results{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;max-height:300px;overflow:auto}
  .results div{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
  .results div:hover{background:#eef8f9}
  .results small{color:var(--muted)}
  .hint{color:var(--muted);font-size:13px;margin:6px 0 12px}
  .country{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px}
  .country h2{margin:0;font-size:19px;display:flex;align-items:center;gap:10px}
  .country h2 img{width:32px;border-radius:3px;box-shadow:0 0 0 1px #0002}
  .country h2 .cnt{margin-left:auto;font-size:13px;color:var(--muted);font-weight:400}
  .city{margin:10px 0 0 6px}
  .city>.ct{font-weight:600;display:flex;align-items:center;gap:6px}
  .lbl{color:var(--accent);font-weight:700;min-width:24px}
  .attr{margin:4px 0 0 34px;display:flex;align-items:center;gap:6px}
  .attr .lbl{color:var(--accent2);min-width:20px}
  .note{background:#fff8e6;border-left:3px solid #f2b705;padding:6px 10px;margin:6px 0 0 34px;border-radius:4px;font-size:14px;white-space:pre-wrap}
  .note .d{color:var(--muted);font-size:12px;display:flex;justify-content:space-between}
  .addnote{margin:6px 0 4px 34px;display:none}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .modal-bg{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:2000}
  .modal{background:#fff;border-radius:12px;padding:16px;width:min(560px,94vw);max-height:86vh;overflow:auto}
  .modal h3{margin-top:0}
  .tools{display:flex;gap:8px;justify-content:flex-end;margin-top:24px}
  nav button .t{display:inline}
  /* ---- Κινητό ---- */
  @media (max-width:700px){
    header{padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
    header h1{font-size:18px;margin:0}
    .stats{margin:2px 0 0;font-size:12px}
    nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
        padding:4px 2px calc(4px + env(safe-area-inset-bottom));justify-content:space-around;gap:0;z-index:1500;box-shadow:0 -2px 10px #0001}
    nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:20px;color:var(--muted);border-radius:8px;flex:1;min-width:0}
    nav button .t{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    nav button.active{background:#e6f4f5;color:var(--accent)}
    main{padding:12px 10px calc(84px + env(safe-area-inset-bottom))}
    #map{height:calc(100vh - 250px);min-height:300px;border-radius:14px}
    .hbtn{padding:5px 11px;font-size:13px}
    .mapchip .bar{width:110px}
    input[type=text],textarea{font-size:16px}
    .country{padding:10px 12px}
    .country h2{font-size:17px}
    .attr{margin-left:22px}
    .note,.addnote{margin-left:22px}
    .x{font-size:20px;padding:4px 8px}
    .btn.small{padding:7px 12px}
    .modal-bg{align-items:flex-end}
    .modal{width:100vw;border-radius:16px 16px 0 0;max-height:88vh;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>🌍 Τα Ταξίδια μου</h1><button class="hbtn" id="shareBtn">📤 Κοινοποίηση</button></div>
  <div class="stats" id="stats"></div>
  <nav>
    <button data-p="map" class="active">📍 <span class="t">Χάρτης</span></button>
    <button data-p="airports">✈️ <span class="t">Αεροδρόμια</span></button>
    <button data-p="countries">🏳️ <span class="t">Χώρες</span></button>
    <button data-p="attractions">🏛️ <span class="t">Αξιοθέατα</span></button>
    <button data-p="notes">📝 <span class="t">Εντυπώσεις</span></button>
  </nav>
</header>

<main>
  <section id="p-map" class="active">
    <div class="row">
      <input type="text" id="placeQ" placeholder="Αναζήτηση πόλης, χωριού, νησιού… (π.χ. Οία, Φλωρεντία)">
      <button class="btn" id="placeGo">Αναζήτηση</button>
    </div>
    <div class="results" id="placeRes" hidden></div>
    <div class="hint">Ή κάνε κλικ οπουδήποτε στον χάρτη για να βάλεις πινέζα στο πιο κοντινό μέρος.</div>
    <div id="map"></div>
  </section>

  <section id="p-airports">
    <div class="row">
      <input type="text" id="apQ" placeholder="Κωδικός (ATH), πόλη ή όνομα αεροδρομίου">
    </div>
    <div class="results" id="apRes" hidden></div>
    <div id="apList"></div>
  </section>

  <section id="p-countries"><div id="cList"></div></section>
  <section id="p-attractions"><div id="aList"></div></section>
  <section id="p-notes"><div id="nList"></div></section>

  <div class="tools">
    <button class="btn sec small" id="exp">⬇️ Αντίγραφο ασφαλείας</button>
    <label class="btn sec small">⬆️ Επαναφορά<input type="file" id="imp" accept=".json" hidden></label>
  </div>
</main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
// ---------- Δεδομένα ----------
const KEY = 'travel-app-v1';
let db = JSON.parse(localStorage.getItem(KEY) || 'null') || {places:[], attractions:[], airports:[], notes:[]};
const save = () => { localStorage.setItem(KEY, JSON.stringify(db)); renderAll(); };
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const regionName = new Intl.DisplayNames(['el'], {type:'region'});
const countryName = cc => { try { return regionName.of(cc.toUpperCase()); } catch { return cc.toUpperCase(); } };
const flag = cc => `<img src="https://flagcdn.com/w80/${cc.toLowerCase()}.png" alt="">`;
const GR = 'αβγδεζηθικλμνξοπρστυφχψω';
const grLetter = i => (i >= GR.length ? GR[Math.floor(i / GR.length) - 1] : '') + GR[i % GR.length];

// ---------- Πλοήγηση ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('active', s.id === 'p-' + b.dataset.p));
  if (b.dataset.p === 'map') setTimeout(() => map.invalidateSize(), 50);
  if (b.dataset.p === 'airports') loadAirports();
});

// ---------- Χάρτης ----------
const map = L.map('map', {worldCopyJump:true, zoomControl:false, minZoom:2}).setView([38, 15], 3);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom:19, attribution:'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap'}).addTo(map);

// Χρωματισμός χωρών που έχεις επισκεφθεί
const WORLD_URL = 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson';
let WORLD = null;
async function loadWorld() {
  if (WORLD) return WORLD;
  const g = await (await fetch(WORLD_URL)).json();
  g.features.forEach(f => {
    const p = f.properties, a2 = p.ISO_A2_EH && p.ISO_A2_EH !== '-99' ? p.ISO_A2_EH : p.ISO_A2;
    f.cc = String(a2).toLowerCase();
  });
  return WORLD = g;
}
const countryLayer = L.geoJSON(null, {interactive:false,
  style: {color:'#0e7c86', weight:1.2, fillColor:'#14a3ad', fillOpacity:.28}}).addTo(map);
function renderCountryLayer() {
  if (!WORLD) return;
  const v = new Set(db.places.map(p => p.cc));
  countryLayer.clearLayers();
  countryLayer.addData(WORLD.features.filter(f => v.has(f.cc)));
}
loadWorld().then(renderCountryLayer).catch(() => {});

// Πινέζες
const pinIcon = L.divIcon({className:'pin', iconSize:[28,38], iconAnchor:[14,37], popupAnchor:[0,-33],
  html:'<svg viewBox="0 0 28 38" width="28" height="38"><path d="M14 1C7 1 1.5 6.6 1.5 13.5 1.5 23 14 37 14 37s12.5-14 12.5-23.5C26.5 6.6 21 1 14 1z" fill="#e4572e" stroke="#fff" stroke-width="2"/><circle cx="14" cy="13.5" r="5" fill="#fff"/></svg>'});
const planeIcon = L.divIcon({className:'plane', html:'✈️', iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-12]});
const layer = L.layerGroup().addTo(map);
const TOTAL_COUNTRIES = 195;

// Κάρτα με στατιστικά πάνω στον χάρτη
const chip = L.control({position:'topleft'});
chip.onAdd = () => { const d = L.DomUtil.create('div', 'mapchip'); d.id = 'mapchip'; L.DomEvent.disableClickPropagation(d); return d; };
chip.addTo(map);
const fitCtl = L.control({position:'topright'});
fitCtl.onAdd = () => { const b = L.DomUtil.create('button', 'mapbtn'); b.innerHTML = '🌍 Όλα'; b.title = 'Δείξε όλα τα μέρη';
  L.DomEvent.disableClickPropagation(b); b.onclick = fitAll; return b; };
fitCtl.addTo(map);
function fitAll() {
  const pts = [...db.places, ...db.airports].map(p => [p.lat, p.lon]);
  if (pts.length === 1) map.setView(pts[0], 8);
  else if (pts.length) map.fitBounds(pts, {padding:[40, 40], maxZoom:8});
  else map.setView([38, 15], 3);
}

function renderMap() {
  layer.clearLayers();
  db.places.forEach(p => {
    const na = attrsOf(p.id).length, nn = notesOf(p.id).length + attrsOf(p.id).reduce((s, a) => s + notesOf(a.id).length, 0);
    L.marker([p.lat, p.lon], {icon:pinIcon, title:p.name}).addTo(layer).bindPopup(`
      <div class="pop-h">${flag(p.cc)} ${esc(p.name)}</div>
      <div class="pop-sub">${esc(countryName(p.cc))}</div>
      <div class="pop-meta">🏛️ ${na} αξιοθέατα · 📝 ${nn} εντυπώσεις</div>
      <button class="btn small" onclick="openAttrPicker('${p.id}')">+ αξιοθέατο</button>
      <button class="btn sec small" onclick="removePlace('${p.id}')">Αφαίρεση</button>`);
  });
  db.airports.forEach(a => {
    L.marker([a.lat, a.lon], {icon:planeIcon, title:a.iata}).addTo(layer)
      .bindPopup(`<div class="pop-h">${flag(a.cc)} ${esc(a.iata)}</div><div class="pop-sub">${esc(a.name)}<br>${esc(a.city)}</div>`);
  });
  renderCountryLayer();
  const nc = new Set(db.places.map(p => p.cc)).size, pct = Math.round(nc / TOTAL_COUNTRIES * 100);
  document.getElementById('mapchip').innerHTML =
    `<b>${nc}</b> ${nc === 1 ? 'χώρα' : 'χώρες'} · <b>${db.places.length}</b> μέρη<br>
     <span style="color:var(--muted)">${pct}% του κόσμου</span><div class="bar"><i style="width:${Math.max(pct, nc ? 2 : 0)}%"></i></div>`;
}

const NOM = 'https://nominatim.openstreetmap.org';
async function nominatim(path) {
  const r = await fetch(`${NOM}/${path}&format=jsonv2&addressdetails=1&accept-language=el`);
  return r.json();
}
function toPlace(r) {
  return {
    id: uid(),
    name: r.name || (r.display_name || '').split(',')[0],
    lat: +r.lat, lon: +r.lon,
    cc: (r.address?.country_code || '').toLowerCase(),
    added: new Date().toISOString()
  };
}
function addPlace(p) {
  if (!p.cc) return alert('Δεν βρέθηκε χώρα για αυτό το σημείο.');
  if (db.places.some(x => x.name === p.name && x.cc === p.cc)) return alert(`Το «${p.name}» υπάρχει ήδη.`);
  db.places.push(p); save();
  map.setView([p.lat, p.lon], Math.max(map.getZoom(), 6));
}
function removePlace(id) {
  const p = db.places.find(x => x.id === id);
  if (!confirm(`Αφαίρεση «${p.name}» μαζί με τα αξιοθέατα και τις εντυπώσεις του;`)) return;
  const aIds = db.attractions.filter(a => a.placeId === id).map(a => a.id);
  db.notes = db.notes.filter(n => n.targetId !== id && !aIds.includes(n.targetId));
  db.attractions = db.attractions.filter(a => a.placeId !== id);
  db.places = db.places.filter(x => x.id !== id);
  map.closePopup(); save();
}

let lastResults = [];
async function searchPlaces() {
  const q = placeQ.value.trim(); if (!q) return;
  placeRes.hidden = false; placeRes.innerHTML = '<div>Αναζήτηση…</div>';
  try {
    lastResults = (await nominatim(`search?q=${encodeURIComponent(q)}&limit=8`)).filter(r => r.address?.country_code);
    placeRes.innerHTML = lastResults.length
      ? lastResults.map((r, i) => `<div data-i="${i}">${esc(r.name || r.display_name.split(',')[0])}<br><small>${esc(r.display_name)}</small></div>`).join('')
      : '<div>Δεν βρέθηκαν αποτελέσματα</div>';
  } catch { placeRes.innerHTML = '<div>Σφάλμα σύνδεσης</div>'; }
}
placeGo.onclick = searchPlaces;
placeQ.onkeydown = e => { if (e.key === 'Enter') searchPlaces(); };
placeRes.onclick = e => {
  const d = e.target.closest('[data-i]'); if (!d) return;
  addPlace(toPlace(lastResults[d.dataset.i]));
  placeRes.hidden = true; placeQ.value = '';
};
map.on('click', async e => {
  try {
    const r = await nominatim(`reverse?lat=${e.latlng.lat}&lon=${e.latlng.lng}&zoom=14`);
    if (!r || r.error) return;
    const a = r.address || {};
    const name = a.village || a.town || a.city || a.hamlet || a.suburb || a.municipality || r.name;
    if (confirm(`Προσθήκη «${name}» (${countryName(a.country_code || '')});`))
      addPlace({...toPlace(r), name, lat: e.latlng.lat, lon: e.latlng.lng});
  } catch { alert('Σφάλμα σύνδεσης'); }
});

// ---------- Αεροδρόμια ----------
let AIRPORTS = null;
async function loadAirports() {
  if (AIRPORTS) return;
  apRes.hidden = false; apRes.innerHTML = '<div>Φόρτωση λίστας αεροδρομίων…</div>';
  try {
    const data = await (await fetch('https://raw.githubusercontent.com/mwgg/Airports/master/airports.json')).json();
    AIRPORTS = Object.values(data).filter(a => a.iata);
    apRes.hidden = true;
  } catch { apRes.innerHTML = '<div>Δεν ήταν δυνατή η φόρτωση των αεροδρομίων</div>'; }
}
apQ.oninput = () => {
  const q = apQ.value.trim().toLowerCase();
  if (!AIRPORTS || q.length < 2) { apRes.hidden = true; return; }
  const hits = AIRPORTS.filter(a => a.iata.toLowerCase() === q || a.city.toLowerCase().includes(q) || a.name.toLowerCase().includes(q))
    .sort((a, b) => (b.iata.toLowerCase() === q) - (a.iata.toLowerCase() === q)).slice(0, 15);
  apRes.hidden = false;
  apRes.innerHTML = hits.length ? hits.map(a => `<div data-i="${a.icao}"><b>${a.iata}</b> · ${esc(a.name)}<br><small>${esc(a.city)}, ${esc(countryName(a.country))}</small></div>`).join('') : '<div>Δεν βρέθηκε</div>';
};
apRes.onclick = e => {
  const d = e.target.closest('[data-i]'); if (!d) return;
  const a = AIRPORTS.find(x => x.icao === d.dataset.i);
  if (db.airports.some(x => x.iata === a.iata)) return alert('Υπάρχει ήδη.');
  db.airports.push({id: uid(), iata: a.iata, name: a.name, city: a.city, cc: a.country.toLowerCase(), lat: a.lat, lon: a.lon});
  apQ.value = ''; apRes.hidden = true; save();
};
function removeAirport(id) { db.airports = db.airports.filter(a => a.id !== id); save(); }
function renderAirports() {
  if (!db.airports.length) { apList.innerHTML = '<div class="empty">Δεν έχεις προσθέσει αεροδρόμια ακόμα.</div>'; return; }
  apList.innerHTML = groupBy(db.airports).map(([cc, list], i) => `
    <div class="country"><h2>${i + 1}. ${flag(cc)} ${esc(countryName(cc))}<span class="cnt">${list.length}</span></h2>
    ${list.map(a => `<div class="city"><div class="ct">✈️ <b>${esc(a.iata)}</b> — ${esc(a.name)} <small style="color:var(--muted)">(${esc(a.city)})</small>
      <button class="x" onclick="removeAirport('${a.id}')">✕</button></div></div>`).join('')}</div>`).join('');
}

// ---------- Ομαδοποίηση ----------
function groupBy(items) {
  const g = {};
  items.forEach(p => (g[p.cc] ||= []).push(p));
  return Object.entries(g).sort((a, b) => countryName(a[0]).localeCompare(countryName(b[0]), 'el'));
}
const attrsOf = pid => db.attractions.filter(a => a.placeId === pid);
const notesOf = tid => db.notes.filter(n => n.targetId === tid);

// ---------- Χώρες & Πόλεις ----------
function renderCountries() {
  if (!db.places.length) { cList.innerHTML = '<div class="empty">Πρόσθεσε μέρη από τον Χάρτη 📍</div>'; return; }
  cList.innerHTML = groupBy(db.places).map(([cc, list], i) => `
    <div class="country"><h2>${i + 1}. ${flag(cc)} ${esc(countryName(cc))}<span class="cnt">${list.length} ${list.length === 1 ? 'μέρος' : 'μέρη'}</span></h2>
    ${list.map((p, j) => `<div class="city"><div class="ct"><span class="lbl">${grLetter(j)})</span> ${esc(p.name)}
      <button class="x" onclick="removePlace('${p.id}')">✕</button></div></div>`).join('')}</div>`).join('');
}

// ---------- Αξιοθέατα ----------
function renderAttractions() {
  if (!db.places.length) { aList.innerHTML = '<div class="empty">Πρόσθεσε πρώτα μέρη από τον Χάρτη 📍</div>'; return; }
  aList.innerHTML = groupBy(db.places).map(([cc, list], i) => `
    <div class="country"><h2>${i + 1}. ${flag(cc)} ${esc(countryName(cc))}</h2>
    ${list.map((p, j) => `<div class="city"><div class="ct"><span class="lbl">${grLetter(j)})</span> ${esc(p.name)}
        <button class="btn sec small" onclick="openAttrPicker('${p.id}')">+ αξιοθέατο</button></div>
      ${attrsOf(p.id).map((a, k) => `<div class="attr"><span class="lbl">${k + 1})</span> ${esc(a.name)}
        <button class="x" onclick="removeAttr('${a.id}')">✕</button></div>`).join('')}
    </div>`).join('')}</div>`).join('');
}
function removeAttr(id) {
  db.attractions = db.attractions.filter(a => a.id !== id);
  db.notes = db.notes.filter(n => n.targetId !== id); save();
}

let suggestions = [];
async function openAttrPicker(pid) {
  const p = db.places.find(x => x.id === pid);
  openModal(`<h3>Αξιοθέατα: ${esc(p.name)}</h3>
    <div class="row"><input type="text" id="attrQ" placeholder="Φίλτρο ή γράψε δικό σου…"><button class="btn" id="attrAdd">Προσθήκη</button></div>
    <div class="results" id="attrRes"><div>Φόρτωση προτάσεων (λίγα δευτερόλεπτα)…</div></div>
    <div style="text-align:right"><button class="btn sec" onclick="closeModal()">Κλείσιμο</button></div>`);
  const draw = () => {
    const q = attrQ.value.trim().toLowerCase();
    const have = new Set(attrsOf(pid).map(a => a.name));
    const list = suggestions.filter(s => !have.has(s.name) && (!q || s.name.toLowerCase().includes(q) || s.alt.toLowerCase().includes(q)));
    attrRes.innerHTML = list.length ? list.map(s => `<div data-n="${esc(s.name)}">${esc(s.name)}${s.alt && s.alt !== s.name ? ` <small>${esc(s.alt)}</small>` : ''}</div>`).join('')
      : '<div>Καμία πρόταση — γράψε το όνομα και πάτα «Προσθήκη»</div>';
  };
  const add = (name, s) => {
    if (!name) return;
    db.attractions.push({id: uid(), placeId: pid, name, lat: s?.lat, lon: s?.lon}); save(); draw();
    attrQ.value = ''; draw();
  };
  attrQ.oninput = draw;
  attrAdd.onclick = () => add(attrQ.value.trim());
  attrQ.onkeydown = e => { if (e.key === 'Enter') add(attrQ.value.trim()); };
  attrRes.onclick = e => { const d = e.target.closest('[data-n]'); if (d) add(d.dataset.n, suggestions.find(s => s.name === d.dataset.n)); };
  suggestions = [];
  try { suggestions = await fetchSights(p.lat, p.lon); } catch {}
  if (document.getElementById('attrRes')) draw();
}

// Προτάσεις από Wikidata: ταξινόμηση κατά δημοφιλία (πλήθος άρθρων Wikipedia)
async function fetchSights(lat, lon) {
  const q = `SELECT ?item ?itemLabel ?en ?loc ?links WHERE {
    { SELECT ?item ?loc ?links WHERE {
      SERVICE wikibase:around { ?item wdt:P625 ?loc. bd:serviceParam wikibase:center "Point(${lon} ${lat})"^^geo:wktLiteral; wikibase:radius "6". }
      ?item wikibase:sitelinks ?links. FILTER(?links > 3)
    } ORDER BY DESC(?links) LIMIT 200 }
    FILTER NOT EXISTS { ?item wdt:P31/wdt:P279* ?bad. VALUES ?bad { wd:Q7275 wd:Q56061 wd:Q486972 wd:Q1048835 wd:Q15642541 wd:Q5 wd:Q1190554 wd:Q1656682 wd:Q3305213 wd:Q11514315 wd:Q4830453 wd:Q131569 wd:Q55488 wd:Q3914 wd:Q16917 wd:Q1248784 wd:Q4022 wd:Q5633421 } }
    OPTIONAL { ?item rdfs:label ?en FILTER(lang(?en)="en") }
    SERVICE wikibase:label { bd:serviceParam wikibase:language "el,en,it,fr,es,de". }
  } ORDER BY DESC(?links) LIMIT 100`;
  const r = await fetch('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q), {headers:{Accept:'application/sparql-results+json'}});
  const seen = new Set();
  return (await r.json()).results.bindings.map(b => {
    const name = b.itemLabel.value;
    if (/^Q\d+$/.test(name) || seen.has(name)) return null; seen.add(name);
    const m = b.loc.value.match(/Point\(([-\d.]+) ([-\d.]+)\)/);
    return {name, alt: b.en?.value || '', kind: '', lon: m ? +m[1] : null, lat: m ? +m[2] : null};
  }).filter(Boolean);
}

// ---------- Εντυπώσεις ----------
function noteBlock(tid) {
  return `${notesOf(tid).map(n => `<div class="note"><div class="d"><span>${new Date(n.date).toLocaleDateString('el-GR')}</span>
      <button class="x" onclick="removeNote('${n.id}')">✕</button></div>${esc(n.text)}</div>`).join('')}
    <div class="addnote" id="an-${tid}"><textarea id="ta-${tid}" placeholder="Τι θυμάσαι; Τι δεν θέλεις να ξεχάσεις;"></textarea>
      <button class="btn small" onclick="addNote('${tid}')">Αποθήκευση</button></div>`;
}
const noteBtn = tid => `<button class="btn sec small" onclick="toggleNote('${tid}')">✏️</button>`;
function renderNotes() {
  if (!db.places.length) { nList.innerHTML = '<div class="empty">Πρόσθεσε πρώτα μέρη από τον Χάρτη 📍</div>'; return; }
  nList.innerHTML = groupBy(db.places).map(([cc, list], i) => `
    <div class="country"><h2>${i + 1}. ${flag(cc)} ${esc(countryName(cc))}</h2>
    ${list.map((p, j) => `<div class="city"><div class="ct"><span class="lbl">${grLetter(j)})</span> ${esc(p.name)} ${noteBtn(p.id)}</div>
      ${noteBlock(p.id)}
      ${attrsOf(p.id).map((a, k) => `<div class="attr"><span class="lbl">${k + 1})</span> ${esc(a.name)} ${noteBtn(a.id)}</div>
        <div style="margin-left:24px">${noteBlock(a.id)}</div>`).join('')}
    </div>`).join('')}</div>`).join('');
}
function toggleNote(tid) {
  const el = document.getElementById('an-' + tid);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
  if (el.style.display === 'block') document.getElementById('ta-' + tid).focus();
}
function addNote(tid) {
  const text = document.getElementById('ta-' + tid).value.trim(); if (!text) return;
  db.notes.push({id: uid(), targetId: tid, text, date: new Date().toISOString()}); save();
}
function removeNote(id) { if (confirm('Διαγραφή εντύπωσης;')) { db.notes = db.notes.filter(n => n.id !== id); save(); } }

// ---------- Modal / Backup ----------
function openModal(html) { modal.innerHTML = html; modalBg.style.display = 'flex'; }
function closeModal() { modalBg.style.display = 'none'; }
modalBg.onclick = e => { if (e.target === modalBg) closeModal(); };
exp.onclick = () => {

imp.onchange = async () => {

    const d = JSON.parse(await imp.files[0].text());
    if (!d.places) throw 0;
    if (confirm('Αντικατάσταση όλων των δεδομένων με το αρχείο;')) { db = {places:[], attractions:[], airports:[], notes:[], ...d}; save(); }

// ---------- Κοινοποίηση ----------
const APP_URL = location.origin + location.pathname.replace(/index\.html$/, '');
const loadImg = src => new Promise(res => { const i = new Image(); i.crossOrigin = 'anonymous';
  i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
function fitText(ctx, t, w) {
  if (ctx.measureText(t).width <= w) return t;
  while (t.length && ctx.measureText(t + '…').width > w) t = t.slice(0, -1);
  return t + '…';
}
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

async function drawShareImage(name, withCities) {
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'), F = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const groups = groupBy(db.places).sort((a, b) => b[1].length - a[1].length);
  const nc = groups.length, pct = Math.round(nc / TOTAL_COUNTRIES * 100);

  // Φόντο
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#0e7c86'); g.addColorStop(1, '#083d4f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Τίτλος
  ctx.fillStyle = '#fff'; ctx.font = `800 64px ${F}`;
  ctx.fillText(fitText(ctx, name || 'Τα Ταξίδια μου', W - 120), 60, 110);
  ctx.font = `500 30px ${F}`; ctx.fillStyle = '#bfe7ea';
  ctx.fillText(name ? 'Τα ταξίδια μου μέχρι σήμερα' : 'Ο ταξιδιωτικός μου χάρτης', 60, 158);

  // Στατιστικά
  const st = [[nc, nc === 1 ? 'χώρα' : 'χώρες'], [db.places.length, 'μέρη'], [db.attractions.length, 'αξιοθέατα'], [db.airports.length, 'αεροδρόμια']];
  const bw = (W - 120 - 3 * 20) / 4;
  st.forEach(([n, l], i) => {
    const x = 60 + i * (bw + 20);
    ctx.fillStyle = '#ffffff1f'; rrect(ctx, x, 195, bw, 120, 18); ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff'; ctx.font = `800 52px ${F}`; ctx.fillText(n, x + bw / 2, 265);
    ctx.font = `500 24px ${F}`; ctx.fillStyle = '#bfe7ea'; ctx.fillText(l, x + bw / 2, 298);
    ctx.textAlign = 'left';
  });

  // Παγκόσμιος χάρτης
  const mx = 40, my = 345, mw = W - 80, mh = mw * (140 / 360), AR = mw / mh;
  // Κάδρο: εστίαση στην περιοχή των ταξιδιών (με περιθώριο), αλλιώς όλος ο κόσμος
  let vx = -180, vy = 84, vw = 360;
  if (db.places.length) {
    const lons = db.places.map(p => p.lon), lats = db.places.map(p => p.lat);
    const x0 = Math.min(...lons), x1 = Math.max(...lons), y0 = Math.min(...lats), y1 = Math.max(...lats);
    vw = Math.min(360, Math.max(50, (x1 - x0) * 1.3 + 24, ((y1 - y0) * 1.3 + 16) * AR));
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, vh = vw / AR;
    vx = Math.min(Math.max(cx - vw / 2, -180), 180 - vw);
    vy = Math.max(Math.min(cy + vh / 2, 84), -56 + vh);
  }
  const P = (lon, lat) => [mx + (lon - vx) / vw * mw, my + (vy - lat) / (vw / AR) * mh];
  ctx.save(); rrect(ctx, mx, my, mw, mh, 22); ctx.fillStyle = '#ffffff0d'; ctx.fill(); ctx.clip();
  try {
    const world = await loadWorld(), v = new Set(db.places.map(p => p.cc));
    world.features.forEach(f => {
      if (f.properties.ADMIN === 'Antarctica') return;
      const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
      ctx.beginPath();
      polys.forEach(poly => poly.forEach(ring => ring.forEach(([lo, la], k) => {
        const [x, y] = P(lo, Math.max(la, -56)); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); })));
      ctx.fillStyle = v.has(f.cc) ? '#f2b705' : '#ffffff2e'; ctx.fill('evenodd');
      ctx.strokeStyle = '#083d4f'; ctx.lineWidth = vw < 200 ? 1.5 : 0.8; ctx.stroke();
    });
  } catch {}
  db.places.forEach(p => { const [x, y] = P(p.lon, p.lat);
    ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fillStyle = '#e4572e'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke(); });
  ctx.restore();

  // Πρόοδος
  let y = my + mh + 40;
  ctx.font = `600 26px ${F}`; ctx.fillStyle = '#fff'; ctx.fillText(`${pct}% του κόσμου`, 60, y);
  ctx.fillStyle = '#ffffff2e'; rrect(ctx, 290, y - 18, W - 350, 16, 8); ctx.fill();
  ctx.fillStyle = '#f2b705'; rrect(ctx, 290, y - 18, Math.max(16, (W - 350) * pct / 100), 16, 8); ctx.fill();

  // Λίστα χωρών (2 στήλες)
  y += 40;
  const rowH = withCities ? 70 : 54, colW = (W - 120 - 40) / 2;
  const rows = Math.floor((H - 90 - y) / rowH), max = rows * 2;
  const shown = groups.length > max ? groups.slice(0, max - 1) : groups;
  const flags = await Promise.all(shown.map(([cc]) => loadImg(`https://flagcdn.com/w80/${cc}.png?cors=1`)));
  const cell = i => [60 + Math.floor(i / rows) * (colW + 40), y + (i % rows) * rowH];
  shown.forEach(([cc, list], i) => {
    const [x, yy] = cell(i);
    if (flags[i]) { ctx.save(); rrect(ctx, x, yy, 48, 34, 5); ctx.clip(); ctx.drawImage(flags[i], x, yy, 48, 34); ctx.restore(); }
    ctx.fillStyle = '#fff'; ctx.font = `700 28px ${F}`;
    ctx.fillText(fitText(ctx, countryName(cc), colW - 120), x + 62, yy + 27);
    ctx.font = `600 24px ${F}`; ctx.fillStyle = '#f2b705'; ctx.textAlign = 'right';
    ctx.fillText(list.length, x + colW, yy + 27); ctx.textAlign = 'left';
    if (withCities) {
      ctx.font = `400 21px ${F}`; ctx.fillStyle = '#bfe7ea';
      ctx.fillText(fitText(ctx, list.map(p => p.name).join(' · '), colW - 62), x + 62, yy + 56);
    }
  });
  if (shown.length < groups.length) {
    const [x, yy] = cell(shown.length);
    ctx.font = `600 26px ${F}`; ctx.fillStyle = '#bfe7ea';
    ctx.fillText(`+ ${groups.length - shown.length} ακόμα χώρες`, x + 62, yy + 27);
  }
  if (!groups.length) { ctx.font = `500 30px ${F}`; ctx.fillStyle = '#bfe7ea'; ctx.fillText('Το πρώτο ταξίδι περιμένει!', 60, y + 30); }

  // Υποσέλιδο
  ctx.fillStyle = '#ffffff1a'; ctx.fillRect(0, H - 70, W, 70);
  ctx.font = `500 24px ${F}`; ctx.fillStyle = '#d7f1f3';
  ctx.fillText('Τα Ταξίδια μου', 60, H - 27);
  ctx.textAlign = 'right'; ctx.fillText(APP_URL.replace(/^https?:\/\//, '').replace(/\/$/, ''), W - 60, H - 27); ctx.textAlign = 'left';
  return c;
}

let shareBlob = null;
async function openShare() {
  openModal(`<h3>📤 Κοινοποίηση</h3>
    <label class="opt" for="shName">Όνομα στην εικόνα (προαιρετικό):</label>
    <div class="row"><input type="text" id="shName" placeholder="π.χ. Δημήτρης" value="${esc(localStorage.getItem('travel-share-name') || '')}"></div>
    <label class="opt"><input type="checkbox" id="shCities" checked> Να φαίνονται και οι πόλεις</label>
    <div id="shWait" class="hint" style="text-align:center;padding:30px 0">⏳ Δημιουργία εικόνας…</div>
    <img id="shareImg" alt="" hidden onload="this.hidden=false;shWait.hidden=true">
    <div class="sharebtns">
      <button class="btn" id="shSend">📤 Στείλε την εικόνα</button>
      <button class="btn sec" id="shSave">⬇️ Αποθήκευση εικόνας</button>
      <button class="btn sec" id="shApp">🔗 Στείλε την εφαρμογή</button>
    </div>
    <div style="text-align:right;margin-top:12px"><button class="btn sec small" onclick="closeModal()">Κλείσιμο</button></div>`);
  let t;
  const redraw = async () => {
    localStorage.setItem('travel-share-name', shName.value.trim());
    const c = await drawShareImage(shName.value.trim(), shCities.checked);
    shareBlob = await new Promise(r => c.toBlob(r, 'image/png'));
    if (document.getElementById('shareImg')) shareImg.src = URL.createObjectURL(shareBlob);
  };
  shName.oninput = () => { clearTimeout(t); t = setTimeout(redraw, 400); };
  shCities.onchange = redraw;
  const file = () => new File([shareBlob], 'ta-taxidia-mou.png', {type:'image/png'});
  const download = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(shareBlob); a.download = 'ta-taxidia-mou.png'; a.click(); };
  shSend.onclick = async () => {
    if (!shareBlob) return;
    if (navigator.canShare?.({files:[file()]})) {
      try { await navigator.share({files:[file()], title:'Τα Ταξίδια μου', text:`Δες πού έχω ταξιδέψει! 🌍\nΦτιάξε κι εσύ τον δικό σου χάρτη: ${APP_URL}`}); } catch {}
    } else { download(); alert('Η εικόνα αποθηκεύτηκε — μπορείς να τη στείλεις από όπου θέλεις.'); }
  };
  shSave.onclick = () => shareBlob && download();
  shApp.onclick = async () => {
    const text = 'Φτιάξε τον δικό σου ταξιδιωτικό χάρτη — δωρεάν, χωρίς διαφημίσεις 🌍';
    if (navigator.share) { try { await navigator.share({title:'Τα Ταξίδια μου', text, url:APP_URL}); } catch {} }
    else { await navigator.clipboard.writeText(APP_URL); alert('Ο σύνδεσμος αντιγράφηκε: ' + APP_URL); }
  };
  await redraw();
}
shareBtn.onclick = openShare;

  const countries = new Set(db.places.map(p => p.cc)).size;
  stats.textContent = `${countries} χώρες · ${db.places.length} μέρη · ${db.attractions.length} αξιοθέατα · ${db.airports.length} αεροδρόμια`;
  renderMap(); renderAirports(); renderCountries(); renderAttractions(); renderNotes();
}

fitAll();
